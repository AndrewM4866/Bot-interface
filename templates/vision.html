<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMR Vision Core</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #121824;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .navbar {
            background-color: #1a2333 !important;
            border-bottom: 1px solid #2e3d56;
        }
        .video-container {
            background-color: #0f141c;
            border: 1px solid #2e3d56;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .feed-placeholder {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            background-color: #000;
        }
        .meta-panel {
            background-color: #1a2333;
            border: 1px solid #2e3d56;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark py-3 mb-5">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="bi bi-robot text-primary fs-3"></i>
                <span class="fw-bold text-uppercase tracking-wider">AMR Core HMI</span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/baseline"><i class="bi bi-speedometer2 me-1"></i> Baseline</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/vision"><i class="bi bi-camera-video me-1"></i> Vision</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 mb-4">
                <div class="video-container p-2 text-center">
                    <div class="bg-dark text-secondary small py-2 border-bottom border-secondary mb-2 d-flex justify-content-between px-3">
                        <span><i class="bi bi-circle-fill text-danger animate-pulse me-1"></i> LIVE_FEED_001</span>
                        <span>Logitech C930e</span>
                    </div>
                    <img src="{{ url_for('video_feed') }}" class="feed-placeholder img-fluid rounded" alt="Webcam Video Stream Status: Offline/Connecting">
                </div>
            </div>

            <div class="col-lg-4 mb-4">
                <div class="meta-panel p-4 h-100">
                    <h4 class="text-white mb-4"><i class="bi bi-sliders me-2 text-info"></i>Stream Diagnostics</h4>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Target Resolution</span>
                        <span class="fw-bold text-light">640 x 480</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Compression Format</span>
                        <span class="fw-bold text-warning">MJPEG (multipart)</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="text-muted">Hardware Accelerator</span>
                        <span class="badge bg-secondary text-dark fw-bold">Google Coral (Pending)</span>
                    </div>
                    <div class="p-3 bg-dark rounded border border-secondary text-center">
                        <small class="text-muted d-block mb-1">Thread State</small>
                        <span class="text-success fw-bold font-monospace"><i class="bi bi-check-circle-fill me-1"></i> BACKGROUND_WORKER_ACTIVE</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
