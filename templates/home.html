<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Mobile Robot Control Core</span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm text-center">
                    <div class="card-header bg-primary text-white font-weight-bold">
                        Random Input
                    </div>
                    <div class="card-body py-4">
                        <h2 class="display-3 text-dark mb-0">
                            <span id="ui-distance">--.-</span> <small class="fs-4 text-muted">- result</small>
                        </h2>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Open a direct, long-lived listener channel back to our Flask server
        const telemetryChannel = new EventSource("/stream");

        // Runs instantly whenever 'yield' outputs data down the stream line
        telemetryChannel.onmessage = function(event) {
            // Parse the data packet string back into a JS object
            const dataPacket = JSON.parse(event.data);
            
            // Swap out the text properties on screen natively 
            document.getElementById("ui-distance").textContent = dataPacket.randomNumber;
        };

        // Automatic connection monitoring error handling
        telemetryChannel.onerror = function(error) {
            console.error("SSE Connection Error:", error);
        };
    </script>
</body>
</html>
